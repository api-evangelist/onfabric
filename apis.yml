name: OnFabric
description: >-
  OnFabric (Fabric) builds portable consumer context for the AI internet,
  letting people bring their full digital self into their favourite LLMs so
  agents become truly personal assistants instead of generic chatbots. Its
  open-source context-use tool converts personal data exports (ChatGPT, Claude,
  Instagram, Google, Netflix, Airbnb) into a local, searchable memory store and
  enriches OpenAI-compatible traffic through a local proxy, while the hosted
  Fabric product exposes that personal context to ChatGPT, Claude and Gemini via
  a Model Context Protocol server. OnFabric is a Silicon Valley consumer-data
  startup backed by Forerunner Ventures.
